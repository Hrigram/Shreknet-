<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Чат ShrekNet • Крысы в ночи</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="monitor-body">
    <div class="chat-container">
        <div class="chat-header">
            <h2>💬 Чат • <span id="username-display">Гость</span></h2>
            <button id="change-name-btn" class="change-name-btn">✎ Сменить имя</button>
        </div>
        <div id="messages-list" class="messages-list">
            <div class="message system">Добро пожаловать в чат! Напишите что-нибудь...</div>
        </div>
        <div class="input-area">
            <input type="text" id="message-input" placeholder="Введите ваше сообщение..." autocomplete="off">
            <button id="send-button">📤 Отправить</button>
        </div>
    </div>
</div>
    <!-- Ретро-клавиатура -->
<div class="retro-keyboard">
    <div class="keyboard-row">
        <div class="key" data-key="`">`</div><div class="key" data-key="1">1</div><div class="key" data-key="2">2</div><div class="key" data-key="3">3</div><div class="key" data-key="4">4</div><div class="key" data-key="5">5</div><div class="key" data-key="6">6</div><div class="key" data-key="7">7</div><div class="key" data-key="8">8</div><div class="key" data-key="9">9</div><div class="key" data-key="0">0</div><div class="key" data-key="-">-</div><div class="key" data-key="=">=</div><div class="key backspace" data-key="Backspace">⌫</div>
    </div>
    <div class="keyboard-row">
        <div class="key tab" data-key="Tab">Tab</div><div class="key" data-key="q">Q</div><div class="key" data-key="w">W</div><div class="key" data-key="e">E</div><div class="key" data-key="r">R</div><div class="key" data-key="t">T</div><div class="key" data-key="y">Y</div><div class="key" data-key="u">U</div><div class="key" data-key="i">I</div><div class="key" data-key="o">O</div><div class="key" data-key="p">P</div><div class="key" data-key="[">[</div><div class="key" data-key="]">]</div><div class="key backslash" data-key="\">\</div>
    </div>
    <div class="keyboard-row">
        <div class="key caps" data-key="CapsLock">Caps</div><div class="key" data-key="a">A</div><div class="key" data-key="s">S</div><div class="key" data-key="d">D</div><div class="key" data-key="f">F</div><div class="key" data-key="g">G</div><div class="key" data-key="h">H</div><div class="key" data-key="j">J</div><div class="key" data-key="k">K</div><div class="key" data-key="l">L</div><div class="key" data-key=";">;</div><div class="key" data-key="'">'</div><div class="key enter" data-key="Enter">⏎</div>
    </div>
    <div class="keyboard-row">
        <div class="key shift" data-key="Shift">Shift</div><div class="key" data-key="z">Z</div><div class="key" data-key="x">X</div><div class="key" data-key="c">C</div><div class="key" data-key="v">V</div><div class="key" data-key="b">B</div><div class="key" data-key="n">N</div><div class="key" data-key="m">M</div><div class="key" data-key=",">,</div><div class="key" data-key=".">.</div><div class="key" data-key="/">/</div><div class="key shift" data-key="Shift">Shift</div>
    </div>
    <div class="keyboard-row">
        <div class="key ctrl" data-key="Control">Ctrl</div><div class="key win" data-key="Meta">⊞</div><div class="key alt" data-key="Alt">Alt</div><div class="key space" data-key=" ">␣</div><div class="key alt" data-key="Alt">Alt</div><div class="key win" data-key="Meta">⊞</div><div class="key ctrl" data-key="Control">Ctrl</div>
    </div>
</div>
<script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js",
            "firebase/database": "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js"
        }
    }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
